[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stemmy-cli"
version = "0.1.0"
description = "Professional CLI for Stemmy audio content platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Stemmy Team" }
]
keywords = [
    "audio",
    "cli",
    "stemmy",
    "podcast",
    "transcription",
    "tts"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "feedparser>=6.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "libsql>=0.1.0",
    "pyfiglet>=1.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
stemmy = "stemmy_cli.main:main"

[project.urls]
Homepage = "https://github.com/twetering/stemmy-cli"
Documentation = "https://github.com/twetering/stemmy-cli#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/stemmy_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "src/stemmy_cli",
]

[tool.hatch.build.targets.wheel.force-include]
"src/stemmy_cli/static" = "stemmy_cli/static"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
